[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # Nomes públicos de modelos; inclui a variável legada ainda presente no painel.
  # GEMINI_API_KEY deve continuar sendo verificada como segredo.
  SECRETS_SCAN_OMIT_KEYS = "VITE_GEMINI_MODEL,GEMINI_MODEL"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/ai"
  to = "/.netlify/functions/ai"
  status = 200
  force = true

# SPA — redireciona todas as rotas para index.html (React Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
