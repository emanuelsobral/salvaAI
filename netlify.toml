[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/ai"
  to = "/.netlify/functions/ai"
  status = 200
  force = true

# SPA — redireciona todas as rotas para index.html (React Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
