<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><title>Teste de imagem PDF</title></head><body>
<p>Teste local de decodificação de PDF, sem acesso ao banco.</p>
<script type="module">
import { readContractPdf } from '../../src/utils/contractPdf.js';
import { openStatementPdf } from '../../src/utils/pdfDocument.js';
if (location.hostname !== '127.0.0.1') throw Error('Somente teste local.');
window.checkPdfDecoding = async (bytes, kind) => {
  const file = new File([new Uint8Array(bytes)], 'ccitt-contract.pdf', { type: 'application/pdf' });
  if (kind === 'contract') return (await readContractPdf(file, { useOcr: true })).pages;
  const result = await openStatementPdf(file);
  try {
    const page = await result.document.getPage(1);
    const viewport = page.getViewport({ scale: 1 });
    const canvas = document.createElement('canvas'); canvas.width = viewport.width; canvas.height = viewport.height;
    const ctx = canvas.getContext('2d');
    await page.render({ canvasContext: ctx, viewport, background: 'white' }).promise;
    const { data } = ctx.getImageData(20, 50, 560, 350);
    let dark = 0;
    for (let i = 0; i < data.length; i += 4) if (data[i] < 100 && data[i + 1] < 100 && data[i + 2] < 100) dark++;
    return { darkPixels: dark, imagePages: result.imagePages };
  } finally { await result.destroy(); }
};
</script></body></html>
